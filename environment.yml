name: pinn-ml-py3.12
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.12
  
  # Core Scientific Stack
  - numpy
  - scipy
  - pandas
  - scikit-learn
  
  # Visualisation
  - matplotlib
  - seaborn
  - ipywidgets
  - ipympl
  
  # ML stack
  - pytorch
  - accelerate

  # Development & Repo Tooling
  - pip
  
  # Python Toolchain Packages (Managed via pip to match your dev flags)
  - pip:
    - -e .[dev]